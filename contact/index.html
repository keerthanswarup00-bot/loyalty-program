<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Contact. Innondu</title>
<meta name="description" content="Tell us about your shop and we will get back to you within a day.">
<meta property="og:title" content="Contact. Innondu">
<meta property="og:description" content="Tell us about your shop and we will get back to you within a day.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css?v=2">
<link rel="stylesheet" href="/assets/home.css?v=2">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="3.2 2.4"/><text x="20" y="25.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="15" fill="currentColor">+1</text></symbol>
  <symbol id="nfc" viewBox="0 0 24 24"><path d="M6 8.5a5 5 0 0 1 0 7M9.5 6a9 9 0 0 1 0 12M13 3.5a13 13 0 0 1 0 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<header>
  <div class="wrap nav">
    <a class="brand" href="/" aria-label="Innondu home"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle class="ring" cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 4.2" stroke-linecap="round"/><text x="20" y="25" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor" font-family="Inter,system-ui,sans-serif">+1</text></svg>Innondu</a>
    <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <nav id="site-menu" aria-label="Main">
      <a href="/about/">About</a>
      <a href="/contact/" aria-current="page">Contact</a>
      <a class="btn sm accent" href="/contact/">Get Innondu</a>
    </nav>
  </div>
</header>
<main id="top">

<section class="hero sm">
  <div class="wrap narrow">
    <div class="eyebrow rise" style="--d:0s">Contact</div>
    <h1 class="rise" style="--d:.08s">Say hello.</h1>
    <p class="lead rise" style="--d:.16s">Tell us about your shop. We reply within a day.</p>
  </div>
</section>

<section class="line" style="padding-top:clamp(32px,5vw,56px)">
  <div class="wrap narrow">
    <div class="contact-grid">
      <form id="cf" class="cform reveal" novalidate>
        <label>Your name<input id="cn" name="name" type="text" autocomplete="name" maxlength="80" required></label>
        <label>Shop <span>(optional)</span><input id="cs" name="shop" type="text" autocomplete="organization" maxlength="80"></label>
        <label>Phone or email<input id="cc" name="contact" type="text" autocomplete="tel" maxlength="120" required></label>
        <label>Message <span>(optional)</span><textarea id="cm" name="message" rows="4" maxlength="1000"></textarea></label>
        <input class="hp" id="ch" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn accent" id="cb" type="submit">Send</button>
        <p class="form-msg" id="cmsg" role="status" aria-live="polite"></p>
      </form>
      <aside class="reveal">
        <div class="aside-card" id="waCard" hidden>
          <h3>Prefer WhatsApp?</h3>
          <a class="btn" id="waBtn" href="#" target="_blank" rel="noopener">Message us</a>
        </div>
      </aside>
    </div>
  </div>
</section>

</main>
<footer>
  <div class="wrap">
    <div><b>Innondu</b> &middot; <span lang="kn">ಇನ್ನೊಂದು</span> means &ldquo;one more&rdquo;</div>
    <nav aria-label="Footer"><a href="/about/">About</a><a href="/contact/">Contact</a><a href="/admin/">Owner login</a></nav>
    <div class="credit">Created by <a href="https://aryanswaroop.com" target="_blank" rel="noopener">aryanswaroop.com</a></div>
  </div>
</footer>
<script src="/assets/site.js?v=2"></script>
<script src="/assets/config.js"></script>
<script src="/assets/contact.js?v=2"></script>
</body>
</html>
