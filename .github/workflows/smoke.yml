name: Innondu CI and smoke tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_JOIN_URL: ${{ secrets.SMOKE_JOIN_URL }}
      SMOKE_STAMP_URL: ${{ secrets.SMOKE_STAMP_URL }}
      SMOKE_CUSTOMER_PASSWORD: ${{ secrets.SMOKE_CUSTOMER_PASSWORD }}
      SMOKE_PHONE_PREFIX: ${{ secrets.SMOKE_PHONE_PREFIX }}
      SMOKE_DAILY_ENABLED: ${{ secrets.SMOKE_DAILY_ENABLED }}
      SMOKE_STAMP_COUNT: ${{ secrets.SMOKE_STAMP_COUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: npm run check:js

      - name: Explain skipped smoke tests
        if: env.SMOKE_BASE_URL == ''
        run: |
          echo "::notice title=Smoke tests skipped::Set the SMOKE_BASE_URL repository secret to enable the live Playwright smoke tests. JavaScript syntax validation still ran."

      - name: Install Chromium
        if: env.SMOKE_BASE_URL != ''
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        id: smoke
        if: env.SMOKE_BASE_URL != ''
        run: npm run test:smoke

      - name: Report end-to-end test coverage
        if: always()
        shell: bash
        run: |
          if [[ -z "$SMOKE_BASE_URL" ]]; then
            {
              echo "## End-to-end browser tests: NOT RUN"
              echo "JavaScript syntax checks ran, but live customer/admin flows were skipped because the SMOKE_BASE_URL repository secret is not configured. This run is not a full end-to-end pass."
              echo "Configure the dedicated smoke business secrets to enable Playwright tests."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=End-to-end tests not run::Syntax checks passed, but browser smoke tests were skipped because SMOKE_BASE_URL is unset."
          elif [[ "${{ steps.smoke.outcome }}" == "success" ]]; then
            {
              echo "## End-to-end browser tests: PASSED"
              echo "Playwright smoke tests ran against the configured dedicated smoke business."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## End-to-end browser tests: FAILED OR INCOMPLETE"
              echo "Review the Playwright smoke-test step and report artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright report
        if: always() && env.SMOKE_BASE_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
