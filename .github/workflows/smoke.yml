name: Royalty Program smoke tests

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    if: ${{ secrets.SMOKE_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_JOIN_URL: ${{ secrets.SMOKE_JOIN_URL }}
      SMOKE_STAMP_URL: ${{ secrets.SMOKE_STAMP_URL }}
      SMOKE_CUSTOMER_PASSWORD: ${{ secrets.SMOKE_CUSTOMER_PASSWORD }}
      SMOKE_PHONE_PREFIX: ${{ secrets.SMOKE_PHONE_PREFIX }}
      SMOKE_DAILY_ENABLED: ${{ secrets.SMOKE_DAILY_ENABLED }}
      SMOKE_STAMP_COUNT: ${{ secrets.SMOKE_STAMP_COUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
