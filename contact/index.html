<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Contact. Innondu</title>
<meta name="description" content="Tell us about your shop and we will get back to you within a day.">
<meta property="og:title" content="Contact. Innondu">
<meta property="og:description" content="Tell us about your shop and we will get back to you within a day.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Kannada:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css?v=2">
<link rel="stylesheet" href="/assets/home.css?v=2">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="3.2 2.4"/><text x="20" y="25.5" text-anchor="middle" font-family="Figtree,system-ui,sans-serif" font-weight="800" font-size="15" fill="currentColor">+1</text></symbol>
  <symbol id="nfc" viewBox="0 0 24 24"><path d="M6 8.5a5 5 0 0 1 0 7M9.5 6a9 9 0 0 1 0 12M13 3.5a13 13 0 0 1 0 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<header>
  <div class="wrap nav">
    <a class="brand" href="/"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle class="ring" cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 4.2" stroke-linecap="round"/><text x="20" y="25" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor" font-family="Figtree,system-ui,sans-serif">+1</text></svg>Innondu</a>
    <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <nav id="site-menu" aria-label="Main">
      <a href="/about/">About</a>
      <a href="/connect/">Connect</a>
      <a href="/contact/" aria-current="page">Contact</a>
      <label class="lang-pick"><span class="sr-only" data-i18n="lang.label">Language</span>
        <select id="lang-pick" aria-label="Language">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
          <option value="kn">ಕನ್ನಡ</option>
        </select>
      </label>
      <a class="btn sm accent" href="/contact/">Get Innondu</a>
    </nav>
  </div>
</header>
<main id="top">

<section class="hero sm">
  <div class="wrap narrow">
    <div class="eyebrow rise" style="--d:0s" data-i18n="contact.eyebrow">Contact</div>
    <h1 class="rise" style="--d:.08s" data-i18n="contact.h1">Set up my shop.</h1>
    <p class="lead rise" style="--d:.16s" data-i18n="contact.lead">Tell us about your shop and we will reply within a day.</p>
  </div>
</section>

<section class="line" style="padding-top:clamp(32px,5vw,56px)">
  <div class="wrap narrow">
    <div class="contact-grid">
      <form id="cf" class="cform reveal" novalidate>
        <label><span data-i18n="contact.name">Your name</span><input id="cn" name="name" type="text" autocomplete="name" maxlength="80" required></label>
        <label><span data-i18n="contact.shop">Shop name</span><input id="cs" name="shop" type="text" autocomplete="organization" maxlength="80" required></label>
        <label><span data-i18n="contact.phone">Phone number</span><input id="cc" name="contact" type="tel" autocomplete="tel" maxlength="120" required></label>
        <label><span data-i18n="contact.area">Area / city</span><input id="carea" name="area" type="text" autocomplete="address-level2" maxlength="80"></label>
        <label><span data-i18n="contact.type">Type of shop</span><input id="ctype" name="type" type="text" autocomplete="organization-title" maxlength="80" data-i18n-placeholder="contact.typePlaceholder" placeholder="e.g. cafe, salon, grocery"></label>
        <label><span data-i18n="contact.message">Message</span> <span data-i18n="contact.optional">(optional)</span><textarea id="cm" name="message" rows="3" maxlength="1000"></textarea></label>
        <input class="hp" id="ch" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn accent" id="cb" type="submit" data-i18n="contact.send">Send</button>
        <p class="consent" data-i18n-html="contact.consent">By submitting, you agree to our <a href="/privacy/">Privacy Policy</a>.</p>
        <p class="form-msg" id="cmsg" role="status" aria-live="polite"></p>
      </form>
      <aside class="reveal">
        <div class="aside-card" id="waCard" hidden>
          <h3 data-i18n="contact.waTitle">Prefer WhatsApp?</h3>
          <a class="btn" id="waBtn" data-site-wa="whatsapp.number" data-wa-msg="contact" href="#" target="_blank" rel="noopener" data-i18n="contact.waCta">Message us</a>
        </div>
      </aside>
    </div>
  </div>
</section>

</main>
<footer>
  <div class="wrap">
    <div class="foot-brand"><b>Innondu</b>, <span data-site-text="founder.city"></span>. Founded by <span data-site-text="founder.name"></span>.</div>
    <div class="foot-contact">
      <a data-site-tel="founder.phone" data-fallback="/contact/" href="/contact/">Phone</a>
      <a data-site-href="whatsapp" data-fallback="/contact/" href="/contact/" target="_blank" rel="noopener">WhatsApp</a>
      <a data-site-mail="founder.email" data-fallback="/contact/" href="/contact/">Email</a>
    </div>
    <nav aria-label="Footer"><a href="/about/">About</a><a href="/connect/">Connect</a><a href="/contact/">Contact</a><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a><a href="/admin/">Owner login</a></nav>
  </div>
</footer>
<script src="/assets/site.config.js?v=1"></script>
<script src="/assets/i18n.js?v=1"></script>
<script src="/assets/site.js?v=2"></script>
<script src="/assets/config.js"></script>
<script src="/assets/contact.js?v=2"></script>
</body>
</html>
